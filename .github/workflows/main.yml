name: AniDB Embed Scraper

on:
  workflow_dispatch:
    inputs:
      anime_slug:
        description: "Anime slug (e.g. naruto-shippuden-3687)"
        required: true
        default: "naruto-shippuden-3687"
      lang_filter:
        description: 'Language filter: "all", "eng", or "jpn"'
        required: true
        default: "all"
      ep_start:
        description: "First episode number (inclusive)"
        required: true
        default: "1"
      ep_end:
        description: "Last episode number (inclusive). Leave blank for last episode."
        required: false
        default: ""
      delay:
        description: "Seconds between requests (default 0.5)"
        required: false
        default: "0.5"
      debug:
        description: "Enable debug mode (true/false)"
        required: false
        default: "false"

  schedule:
    # Optional: run on a schedule (remove or adjust as needed)
    # - cron: '0 6 * * *'   # daily at 06:00 UTC
    - cron: "0 0 1 1 *" # effectively disabled (Jan 1 only)

jobs:
  scrape:
    name: Scrape AniDB Embeds
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run scraper
        env:
          ANIME_SLUG:    ${{ github.event.inputs.anime_slug  || 'naruto-shippuden-3687' }}
          LANG_FILTER:   ${{ github.event.inputs.lang_filter  || 'all' }}
          EP_START:      ${{ github.event.inputs.ep_start     || '1' }}
          EP_END:        ${{ github.event.inputs.ep_end       || '' }}
          DELAY:         ${{ github.event.inputs.delay        || '0.5' }}
          DEBUG:         ${{ github.event.inputs.debug        || 'false' }}
          # Optional: add a residential proxy to bypass Cloudflare on GH Actions IPs
          # Store as a repo secret: Settings → Secrets → SCRAPER_PROXY
          # Format: http://user:pass@host:port  (leave secret unset to disable)
          SCRAPER_PROXY: ${{ secrets.SCRAPER_PROXY }}
        run: |
          python anidb_embed_scraper.py

      - name: Upload results as artifact
        if: always()   # upload even if the scraper step failed (contains debug log)
        uses: actions/upload-artifact@v4
        with:
          name: anidb-embeds-${{ github.event.inputs.anime_slug || 'output' }}
          path: |
            anidb_embeds.json
            anidb_debug.log
          if-no-files-found: warn
          retention-days: 30
